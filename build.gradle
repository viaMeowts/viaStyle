plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.21'
}

group = project.maven_group
base.archivesName = project.archives_base_name
version = project.mod_version + "+mc" + project.minecraft_version

repositories {
	maven { url 'https://maven.fabricmc.net/' }
	maven {
		url 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	mavenCentral()
}

dependencies {
	// 26.x ships unobfuscated jars with Mojang names: no mappings, no remap.
	minecraft "net.minecraft:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	def viaPanelApiJar = fileTree(dir: '../lib', include: ['viapanel-*.jar'])
	if (viaPanelApiJar.isEmpty()) {
		throw new GradleException("Missing standalone viaPanel jar in ../lib/. Build viapanel separately and copy viapanel-*.jar into ../lib/.")
	}
	compileOnly viaPanelApiJar

	// TextPlaceholderAPI is an optional runtime-only dependency resolved via reflection.
	// No compile-time dependency needed — loaded reflectively if present at runtime.

	// Vanish (DrexHD) — optional compile-time dependency.
	// VanishCompat.java is the entry point; it is only class-loaded when melius-vanish is present.
	// Official developer docs recommend using the Modrinth Maven artifact.
	compileOnly "maven.modrinth:vanish:${project.vanish_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "loader_version", project.loader_version
	inputs.property "minecraft_version", project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
		       "loader_version": project.loader_version,
		       "minecraft_version": project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release.set(25)
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}

artifacts {
 	archives sourcesJar
}
